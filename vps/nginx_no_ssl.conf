# =============================================================================
# nginx_no_ssl.conf — Sogni d'Oro Streamlit App (HTTP only, SENZA SSL)
# =============================================================================
# Versione semplificata da usare PRIMA di configurare certbot.
# Permette di verificare che nginx + Streamlit funzionino correttamente
# su HTTP prima di aggiungere SSL.
#
# File da copiare in: /etc/nginx/sites-available/sognidoro
# Poi abilitare con: sudo ln -s /etc/nginx/sites-available/sognidoro /etc/nginx/sites-enabled/
# Infine: sudo nginx -t && sudo systemctl reload nginx
#
# Workflow consigliato:
#   1. Copia questo file, testa che l'app risponda su http://DOMAIN_NAME
#   2. Quando funziona, esegui: sudo certbot --nginx -d DOMAIN_NAME -d www.DOMAIN_NAME
#   3. Sostituisci con nginx.conf (versione SSL completa) e ricarica nginx
#
# Sostituire DOMAIN_NAME con il dominio reale (es. sognidoro.it)
# =============================================================================


# =============================================================================
# SERVER BLOCK — HTTP porta 80, reverse proxy verso Streamlit
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN_NAME www.DOMAIN_NAME;

    # -------------------------------------------------------------------------
    # Log specifici del sito
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/sognidoro_access.log;
    error_log  /var/log/nginx/sognidoro_error.log;

    # -------------------------------------------------------------------------
    # Blocco accesso a file e directory nascosti (.git, .env, ecc.)
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # WebSocket — OBBLIGATORIO per Streamlit
    # -------------------------------------------------------------------------
    location /_stcore/stream {
        proxy_pass             http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
        proxy_connect_timeout  60s;
    }

    location /stream {
        proxy_pass             http://127.0.0.1:8501/stream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
        proxy_connect_timeout  60s;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy principale — tutto verso Streamlit su localhost:8501
    # -------------------------------------------------------------------------
    location / {
        proxy_pass             http://127.0.0.1:8501;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_buffering        on;
        proxy_buffer_size      128k;
        proxy_buffers          4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
        proxy_connect_timeout  60s;
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------------------
    # Pagina di errore
    # -------------------------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}
