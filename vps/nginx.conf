# =============================================================================
# nginx.conf — Sogni d'Oro Streamlit App
# =============================================================================
# File da copiare in: /etc/nginx/sites-available/sognidoro
# Poi abilitare con: sudo ln -s /etc/nginx/sites-available/sognidoro /etc/nginx/sites-enabled/
# Infine: sudo nginx -t && sudo systemctl reload nginx
#
# Requisiti:
#   - App Streamlit in ascolto su localhost:8501
#   - Certificati SSL generati da certbot (Let's Encrypt)
#   - Sostituire DOMAIN_NAME con il dominio reale (es. sognidoro.it)
# =============================================================================


# -----------------------------------------------------------------------------
# Gzip compression globale
# (se incluso via sites-available, queste direttive vanno nel blocco server
#  oppure in /etc/nginx/conf.d/gzip.conf a livello globale)
# -----------------------------------------------------------------------------
# NB: le direttive gzip_* sono valide solo nel contesto http{}.
# Se questo file viene incluso da nginx.conf principale, sposta il blocco gzip
# fuori dal blocco server. Qui le lasciamo come riferimento nella sezione server
# usando solo ciò che è consentito nel contesto server/location.


# =============================================================================
# SERVER BLOCK 1 — HTTP → HTTPS redirect (porta 80)
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name DOMAIN_NAME www.DOMAIN_NAME;

    # Log specifici del sito
    access_log /var/log/nginx/sognidoro_access.log;
    error_log  /var/log/nginx/sognidoro_error.log;

    # Blocco accesso a file e directory nascosti (.git, .env, ecc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect permanente verso HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
# SERVER BLOCK 2 — HTTPS (porta 443) con SSL + reverse proxy verso Streamlit
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name DOMAIN_NAME www.DOMAIN_NAME;

    # -------------------------------------------------------------------------
    # Log
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/sognidoro_access.log;
    error_log  /var/log/nginx/sognidoro_error.log;

    # -------------------------------------------------------------------------
    # Certificati SSL — generati da certbot (Let's Encrypt)
    # Eseguire: sudo certbot --nginx -d DOMAIN_NAME -d www.DOMAIN_NAME
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;

    # File di parametri DH generato da certbot (opzionale ma consigliato)
    # sudo openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Protocolli e cipher suite sicuri
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Session SSL
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (migliora performance handshake SSL)
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # -------------------------------------------------------------------------
    # Header di sicurezza HTTP
    # -------------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # Gzip compression (riduce dimensione risposte testuali)
    # -------------------------------------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # -------------------------------------------------------------------------
    # Blocco accesso a file e directory nascosti (.git, .env, ecc.)
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Cache-Control per asset statici di Streamlit
    # Streamlit serve i propri file statici da /_stcore/ e /static/
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass         http://127.0.0.1:8501;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache browser per 1 ora (Streamlit usa hash nei nomi file per cache-busting)
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        expires 1h;
    }

    # -------------------------------------------------------------------------
    # WebSocket — OBBLIGATORIO per Streamlit
    # Streamlit usa WebSocket per la comunicazione bidirezionale UI ↔ backend.
    # Senza questo blocco l'app si carica ma non interagisce.
    # -------------------------------------------------------------------------
    location /_stcore/stream {
        proxy_pass             http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version     1.1;

        # Header necessari per l'upgrade a WebSocket
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";

        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # Timeout molto generosi: le sessioni WebSocket di Streamlit
        # possono durare ore (es. utente tiene aperta la tab)
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
        proxy_connect_timeout  60s;
    }

    # Endpoint Stream alternativo (alcune versioni di Streamlit usano /stream)
    location /stream {
        proxy_pass             http://127.0.0.1:8501/stream;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
        proxy_connect_timeout  60s;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy principale — tutto il resto verso Streamlit
    # -------------------------------------------------------------------------
    location / {
        proxy_pass             http://127.0.0.1:8501;
        proxy_http_version     1.1;

        # Header standard reverse proxy
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # Header WebSocket (per le connessioni che passano da qui)
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "upgrade";

        # Dimensione buffer — Streamlit può inviare payload di medie dimensioni
        proxy_buffering        on;
        proxy_buffer_size      128k;
        proxy_buffers          4 256k;
        proxy_busy_buffers_size 256k;

        # Timeout
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
        proxy_connect_timeout  60s;

        # Non caricare chunked responses in buffer prima di inviarle al client
        proxy_request_buffering off;
    }

    # -------------------------------------------------------------------------
    # Pagina di errore personalizzata (opzionale)
    # -------------------------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}
